BASE: ['']
TOOLBOX_MODE: "only_test"      # "train_and_test"  or "only_test"
STREAMING_INFERENCE: False     # Set to True to skip preprocessing and run direct streaming inference
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: True
  DATA:
    FILTERING:
      USE_EXCLUSION_LIST: True
      # To test ONLY s1_T1, exclude the other two videos (s1_T2, s1_T3)
      EXCLUSION_LIST: ['s1_T2', 's1_T3']
      SELECT_TASKS: False
      TASK_LIST: ['T1', 'T2', 'T3']  # Not used when SELECT_TASKS is False
    FS: 35
    DATASET: UBFC-PHYS
    DO_PREPROCESS: True                   # Set to True to preprocess, False to use existing preprocessed data
    DATA_FORMAT: NDCHW
    DATA_PATH: "/home/ubuntu/RAWDATA"          # Raw dataset path
    CACHED_PATH: "/home/ubuntu/PreprocessedData"    # Processed dataset save path
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE: [ 'DiffNormalized','Standardized' ]
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 210  # Reduced for lower memory usage on CPU
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True   # Disabled to reduce memory usage,
          DYNAMIC_DETECTION_FREQUENCY : 35
          USE_MEDIAN_FACE_BOX: True    # Disabled when dynamic detection is off
      RESIZE:
        H: 72
        W: 72
DEVICE: cpu
NUM_OF_GPU_TRAIN: 0 
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.2
  NAME: DeepPhys
INFERENCE:
  BATCH_SIZE: 1  # Reduced for CPU processing to avoid memory issues
  EVALUATION_METHOD: FFT        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 10        # In seconds
  MODEL_PATH:   "final_model_release/PURE_DeepPhys.pth"
